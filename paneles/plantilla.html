<!DOCTYPE html>
<!--
  PLANTILLA BASE DE PANEL — NO EDITAR PARA UN PANEL CONCRETO.

  Este archivo es la fuente que usa build.js para generar cada página de
  panel (paneles/<id>.html) a partir del contenido en /contenido/*.md.
  Los tokens con dobles llaves (ver el cuerpo del documento) los rellena
  el script de construcción.

  Para añadir o cambiar un panel, edita/crea un archivo en /contenido/ y
  vuelve a ejecutar `node build.js`. No toques este archivo salvo que
  quieras cambiar el diseño de TODOS los paneles a la vez.
-->
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{{TITULO}} — Homenaje a Fulgencio Romera Asensio</title>
<link rel="stylesheet" href="../css/estilo.css" />
</head>
<body>

{{AVISO_PROVISIONAL}}

<section class="hero">
  <div class="hero-nav">
    <a class="hero-volver" href="../index.html">← Volver</a>
    <span class="hero-indicador">{{POSICION}} / {{TOTAL}}</span>
  </div>

  <button class="hero-tap" type="button" aria-label="Reproducir o pausar el audio de este panel">
    <img src="{{FOTO}}" alt="{{FOTO_ALT}}" />
  </button>

  <div class="hero-overlay">
    <div class="hero-info">
      <span class="etiqueta-bloque">{{BLOQUE_ETIQUETA}}</span>
      <h1 class="hero-titulo">{{TITULO}}</h1>
    </div>
    <div class="hero-reproductor">
      <span class="boton-play" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
      </span>
      <span id="hero-texto" class="hero-texto">Toca para escuchar su voz</span>
    </div>
  </div>

  <span id="hero-progreso" class="hero-progreso"></span>
</section>

<audio id="audio-panel" src="{{AUDIO}}" preload="metadata"></audio>

<main class="contenido-panel">
  <div class="contexto">
{{CONTEXTO_HTML}}
  </div>

  <blockquote class="cita">{{CITA}}</blockquote>

  <p class="fuente-audio">Fuente del audio: {{AUDIO_FUENTE}}</p>

  <a class="boton-volver" href="../index.html">← Volver a la exposición completa</a>
</main>

<script src="../js/panel.js"></script>
</body>
</html>
